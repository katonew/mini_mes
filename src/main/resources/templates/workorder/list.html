<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('작업지시 관리', ~{::main})}"><head><title>작업지시 관리</title></head><body><main id="main-content">
    <section class="page-heading"><div><p class="eyebrow">PRODUCTION / WORK ORDERS</p><h1>작업지시 관리</h1><p class="page-description">생산계획과 적용 BOM·Routing을 연결하고 작업 상태를 관리합니다.</p></div><a class="btn btn-primary" th:href="@{/work-orders/new}">＋ 작업지시 등록</a></section>
    <section class="panel search-panel" aria-labelledby="search-title"><div class="section-heading"><h2 id="search-title">작업지시 검색</h2></div>
        <form method="get" th:action="@{/work-orders}" class="row g-3 align-items-end">
            <div class="col-md-2"><label class="form-label" for="orderId">작업지시 ID</label><input class="form-control" id="orderId" name="id" inputmode="numeric" maxlength="19" pattern="[0-9]+" th:value="${id}"></div>
            <div class="col-md-2"><label class="form-label" for="planId">생산계획 ID</label><input class="form-control" id="planId" name="planId" inputmode="numeric" maxlength="19" pattern="[0-9]+" th:value="${planId}"></div>
            <div class="col-md-3"><label class="form-label" for="keyword">완제품 코드·명칭</label><input class="form-control" id="keyword" name="keyword" type="search" maxlength="200" th:value="${keyword}"></div>
            <div class="col-md-2"><label class="form-label" for="status">상태</label><select class="form-select" id="status" name="status"><option value="">전체</option><option th:each="state : ${statuses}" th:value="${state.code}" th:text="${state.label}" th:selected="${state.code == status}"></option></select></div>
            <div class="col-md-3 search-actions"><a class="btn btn-outline-secondary" th:href="@{/work-orders}">초기화</a><button class="btn btn-primary" type="submit">검색</button></div>
        </form><div th:if="${searchError}" class="alert alert-danger mt-3 mb-0" role="alert" th:text="${searchError}"></div>
    </section>
    <section class="panel list-panel" aria-labelledby="list-title"><div class="list-heading"><div class="d-flex align-items-center gap-2"><h2 id="list-title">작업지시 목록</h2><span class="count-pill" th:if="${searchError == null}" th:text="${#lists.size(orders)}"></span></div><span class="subtle">최신 등록순</span></div>
        <div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th scope="col">작업지시 / 계획</th><th scope="col">완제품</th><th scope="col">지시수량</th><th scope="col">BOM 버전</th><th scope="col">Routing 개정</th><th scope="col">상태</th><th scope="col">등록일 (KST)</th></tr></thead>
            <tbody><tr th:each="order : ${orders}"><td><a class="item-code" th:href="@{/work-orders/{id}(id=${order.workOrderId})}" th:text="${order.workOrderId}"></a><small class="d-block subtle" th:text="${'계획 ' + order.productionPlanId}"></small></td><td class="item-name"><span th:text="${order.productName}"></span><small class="d-block subtle" th:text="${order.productCode}"></small></td>
                <td th:text="${order.orderedQty.stripTrailingZeros().toPlainString() + ' ' + order.productUnitCode}"></td><td th:text="${order.bomCode + ' V' + order.bomVersionNo}"></td><td th:text="${order.routingCode + ' R' + order.routingRevisionNo}"></td><td><span class="status-badge" th:classappend="${order.status == 'IN_PROGRESS' or order.status == 'COMPLETED' ? 'status-active' : 'status-inactive'}" th:text="${order.statusLabel}"></span></td><td th:text="${@kstDateTimeFormatter.formatUtc(order.createdAt, 'yyyy-MM-dd HH:mm')}"></td></tr>
                <tr th:if="${#lists.isEmpty(orders) and searchError == null}"><td colspan="7" class="empty-state"><strong>조회된 작업지시가 없습니다</strong><p>검색 조건을 변경하거나 새 작업지시를 등록해 주세요.</p><a class="btn btn-outline-primary btn-sm" th:href="@{/work-orders/new}">작업지시 등록</a></td></tr><tr th:if="${searchError}"><td colspan="7" class="empty-state">검색 조건을 확인해 주세요.</td></tr>
            </tbody></table></div>
    </section>
</main></body></html>
