<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('품질검사 목록', ~{::main})}"><head><title>품질검사 목록</title></head><body><main id="main-content">
    <section class="page-heading"><div><p class="eyebrow">QUALITY / INSPECTIONS</p><h1>최종 품질검사</h1><p class="page-description">완제품 LOT별 검사 회차와 합격·불합격 수량을 조회합니다.</p></div><a class="btn btn-primary" th:href="@{/quality-inspections/new}">품질검사 등록</a></section>
    <section class="panel search-panel"><form method="get" th:action="@{/quality-inspections}" class="row g-3 align-items-end">
        <div class="col-md-2"><label class="form-label" for="workOrderId">작업지시 ID</label><input class="form-control" id="workOrderId" name="workOrderId" th:value="${workOrderId}" inputmode="numeric"></div>
        <div class="col-md-2"><label class="form-label" for="finishedLotId">완제품 LOT ID</label><input class="form-control" id="finishedLotId" name="finishedLotId" th:value="${finishedLotId}" inputmode="numeric"></div>
        <div class="col-md-3"><label class="form-label" for="lotNo">LOT 번호</label><input class="form-control" id="lotNo" name="lotNo" th:value="${lotNo}" maxlength="64"></div>
        <div class="col-md-3"><label class="form-label" for="keyword">제품 코드·명</label><input class="form-control" id="keyword" name="keyword" th:value="${keyword}" maxlength="200"></div>
        <div class="col-md-2 d-flex gap-2"><button class="btn btn-primary" type="submit">검색</button><a class="btn btn-outline-secondary" th:href="@{/quality-inspections}">초기화</a></div>
    </form><div th:if="${searchError}" class="alert alert-danger mt-3 mb-0" role="alert" th:text="${searchError}"></div></section>
    <div th:replace="~{quality/fragments :: limitation}"></div>
    <section class="panel list-panel"><div class="list-heading"><h2>검사 이력</h2><span class="count-pill" th:text="${#lists.size(inspections)}"></span></div><div th:replace="~{quality/fragments :: rows(${inspections})}"></div></section>
</main></body></html>
