<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('LOT 추적', ~{::main})}">
<head><title>LOT 추적</title></head><body><main id="main-content" class="lot-trace">
    <section class="page-heading"><div><p class="eyebrow">LOT / TRACEABILITY</p><h1>LOT 추적</h1><p class="page-description">원자재의 투입처와 완제품의 생산 근거를 작업지시 기준으로 확인합니다.</p></div></section>
    <section class="panel search-panel" aria-labelledby="search-title"><div class="section-heading"><h2 id="search-title">추적 대상 검색</h2></div>
        <form method="get" th:action="@{/lot-traces}" class="row g-3 align-items-end">
            <div class="col-md-4"><label class="form-label" for="direction">추적 방향</label><select class="form-select" id="direction" name="direction"><option value="forward" th:selected="${direction == 'forward'}">정방향 · 원자재 LOT → 작업지시 → 완제품 LOT</option><option value="backward" th:selected="${direction == 'backward'}">역방향 · 완제품 LOT → 사용 원자재 LOT</option></select></div>
            <div class="col-md-5"><label class="form-label" for="lotNo">LOT 번호</label><input class="form-control code-input" id="lotNo" name="lotNo" type="search" maxlength="64" th:value="${lotNo}" placeholder="선택한 방향의 LOT 번호 입력"></div>
            <div class="col-md-3 search-actions"><a class="btn btn-outline-secondary" th:href="@{/lot-traces}">초기화</a><button class="btn btn-primary" type="submit">검색</button></div>
        </form><div th:if="${searchError}" class="alert alert-danger mt-3 mb-0" role="alert" th:text="${searchError}"></div>
    </section>
    <div class="alert alert-info" role="note">작업지시 단위의 추적입니다. 연결된 완제품 LOT는 영향 가능 범위이며, 개별 완제품에 사용된 원자재를 식별하지 않습니다.</div>
    <section class="panel list-panel"><div class="list-heading"><h2 th:text="${direction == 'backward' ? '완제품 LOT 검색 결과' : '원자재 LOT 검색 결과'}"></h2><span class="count-pill" th:if="${searchError == null}" th:text="${#lists.size(lots)}"></span></div>
        <div class="table-responsive"><table class="table trace-table align-middle mb-0"><thead><tr><th scope="col">LOT 번호</th><th scope="col">품목</th><th scope="col">수량</th><th scope="col">추적</th></tr></thead><tbody>
            <tr th:each="lot : ${lots}">
                <td data-label="LOT 번호"><a class="item-code" th:href="${direction == 'forward'} ? @{/raw-material-lots/{id}/trace(id=${lot.rawLotId})} : @{/finished-goods-lots/{id}/trace(id=${lot.finishedLotId})}" th:text="${lot.lotNo}"></a></td>
                <td data-label="품목"><span class="item-name" th:text="${direction == 'forward' ? lot.itemName : lot.productName}"></span><small class="subtle" th:text="${direction == 'forward' ? lot.itemCode : lot.productCode}"></small></td>
                <td data-label="수량"><span th:if="${direction == 'forward'}" th:text="${'등록 ' + lot.registeredQty.stripTrailingZeros().toPlainString() + ' / 가용 ' + lot.availableQty.stripTrailingZeros().toPlainString() + ' ' + lot.unitCode}"></span><span th:if="${direction == 'backward'}" th:text="${'누적 생산 ' + lot.producedQty.stripTrailingZeros().toPlainString() + ' EA'}"></span></td>
                <td data-label="추적"><a th:href="${direction == 'forward'} ? @{/raw-material-lots/{id}/trace(id=${lot.rawLotId})} : @{/finished-goods-lots/{id}/trace(id=${lot.finishedLotId})}" th:text="${direction == 'forward' ? '정방향 추적' : '역방향 추적'}"></a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(lots) and searchError == null}"><td colspan="4" class="empty-state">검색 조건에 맞는 LOT이 없습니다. 추적 방향과 LOT 번호를 확인해 주세요.</td></tr>
        </tbody></table></div>
    </section>
</main></body></html>
