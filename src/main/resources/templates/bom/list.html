<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('BOM 관리', ~{::main})}">
<head><title>BOM 관리</title></head><body>
<main id="main-content">
    <section class="page-heading">
        <div><p class="eyebrow">MASTER DATA / BOM</p><h1>BOM 관리</h1>
            <p class="page-description">완제품의 구성 원자재와 기준 소요량을 버전별로 관리합니다.</p></div>
        <a class="btn btn-primary" th:href="@{/boms/new}">＋ BOM 등록</a>
    </section>
    <section class="panel search-panel" aria-labelledby="search-title">
        <div class="section-heading"><h2 id="search-title">BOM 검색</h2><span class="subtle">완제품 코드와 명칭으로 조회</span></div>
        <form method="get" th:action="@{/boms}" class="row g-3 align-items-end">
            <div class="col-md-4"><label class="form-label" for="searchCode">완제품 코드</label>
                <input class="form-control" id="searchCode" name="code" type="search" maxlength="50" th:value="${code}" placeholder="완제품 코드 입력"></div>
            <div class="col-md-5"><label class="form-label" for="searchName">완제품 명칭</label>
                <input class="form-control" id="searchName" name="name" type="search" maxlength="200" th:value="${name}" placeholder="완제품 명칭 입력"></div>
            <div class="col-md-3 search-actions"><a class="btn btn-outline-secondary" th:href="@{/boms}">초기화</a><button class="btn btn-primary" type="submit">검색</button></div>
        </form>
        <div th:if="${searchError}" class="alert alert-danger mt-3 mb-0" role="alert" th:text="${searchError}"></div>
    </section>
    <section class="panel list-panel" aria-labelledby="list-title">
        <div class="list-heading"><div class="d-flex align-items-center gap-2"><h2 id="list-title">BOM 버전 목록</h2>
            <span th:if="${searchError == null}" class="count-pill" th:text="${#lists.size(boms)}"></span></div><span class="subtle">BOM 최신 등록 · 버전 내림차순</span></div>
        <div class="table-responsive"><table class="table align-middle mb-0">
            <thead><tr><th scope="col">BOM 코드</th><th scope="col">완제품</th><th scope="col">버전</th><th scope="col">기준 생산수량</th><th scope="col">사용 이력</th><th scope="col" class="text-end">관리</th></tr></thead>
            <tbody>
            <tr th:each="version : ${boms}">
                <td><a class="item-code" th:href="@{/boms/versions/{id}(id=${version.bomVersionId})}" th:text="${version.bomCode}"></a></td>
                <td class="item-name"><span th:text="${version.productName}"></span><small class="d-block subtle" th:text="${version.productCode}"></small></td>
                <td th:text="${'V' + version.versionNo}"></td>
                <td th:text="${version.baseQty.stripTrailingZeros().toPlainString() + ' ' + version.productUnitCode}"></td>
                <td><span class="status-badge" th:classappend="${version.used ? 'status-active' : 'status-inactive'}" th:text="${version.used ? '사용 이력 있음' : '사용 이력 없음'}"></span></td>
                <td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/boms/versions/{id}(id=${version.bomVersionId})}" th:attr="aria-label=${version.bomCode + ' V' + version.versionNo + ' 상세'}">상세</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(boms) and searchError == null}"><td colspan="6" class="empty-state"><span class="empty-mark" aria-hidden="true">—</span><strong>조회된 BOM이 없습니다</strong><p>검색 조건을 변경하거나 새로운 BOM을 등록해 주세요.</p><a class="btn btn-outline-primary btn-sm" th:href="@{/boms/new}">BOM 등록</a></td></tr>
            <tr th:if="${searchError}"><td colspan="6" class="empty-state">검색 조건을 확인해 주세요.</td></tr>
            </tbody>
        </table></div>
        <div class="table-note"><span class="note-dot"></span>사용 이력이 있는 버전은 보존하며, 변경된 구성은 새 버전으로 등록합니다.</div>
    </section>
</main></body></html>
