<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('처리 안내', ~{::main})}">
<head><title>처리 안내</title></head>
<body>
<main id="main-content">
    <section class="panel error-panel">
        <p class="eyebrow">REQUEST NOTICE</p>
        <h1 th:text="${safeTitle ?: '요청을 처리하지 못했습니다'}"></h1>
        <p class="page-description" th:text="${safeMessage ?: '주소와 입력값을 확인한 후 다시 시도해 주세요.'}"></p>
        <a th:if="${activeMenu == 'processes'}" class="btn btn-primary" th:href="@{/processes}">공정 목록으로 이동</a>
        <a th:if="${activeMenu == 'routings'}" class="btn btn-primary" th:href="@{/routings}">Routing 목록으로 이동</a>
        <a th:if="${activeMenu == 'production-plans'}" class="btn btn-primary" th:href="@{/production-plans}">생산계획 목록으로 이동</a>
        <a th:if="${activeMenu == 'work-orders'}" class="btn btn-primary" th:href="@{/work-orders}">작업지시 목록으로 이동</a>
        <a th:if="${activeMenu == 'raw-material-lots'}" class="btn btn-primary" th:href="@{/raw-material-lots}">원자재 LOT 목록으로 이동</a>
        <a th:if="${activeMenu == 'material-consumptions'}" class="btn btn-primary" th:href="@{/material-consumptions}">원자재 투입 이력으로 이동</a>
        <a th:unless="${activeMenu == 'processes' or activeMenu == 'routings' or activeMenu == 'production-plans' or activeMenu == 'work-orders' or activeMenu == 'raw-material-lots' or activeMenu == 'material-consumptions'}" class="btn btn-primary" th:href="${returnToBoms == true or activeMenu == 'boms'} ? @{/boms} : @{/items}"
           th:text="${returnToBoms == true or activeMenu == 'boms' ? 'BOM 목록으로 이동' : '품목 목록으로 이동'}"></a>
    </section>
</main>
</body>
</html>
