<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('완제품 LOT 목록', ~{::main})}"><head><title>완제품 LOT 목록</title></head><body><main id="main-content"><section class="page-heading"><div><p class="eyebrow">LOT / FINISHED GOODS</p><h1>완제품 LOT</h1><p class="page-description">최초 생산실적에서 생성된 완제품 LOT을 조회합니다.</p></div></section>
    <section class="panel search-panel"><div class="section-heading"><h2>LOT 검색</h2></div><form method="get" th:action="@{/finished-goods-lots}" class="row g-3 align-items-end"><div class="col-md-3"><label class="form-label" for="workOrderId">작업지시 ID</label><input class="form-control" id="workOrderId" name="workOrderId" inputmode="numeric" th:value="${workOrderId}"></div><div class="col-md-3"><label class="form-label" for="lotNo">LOT 번호</label><input class="form-control" id="lotNo" name="lotNo" maxlength="64" th:value="${lotNo}"></div><div class="col-md-3"><label class="form-label" for="keyword">제품 코드·명칭</label><input class="form-control" id="keyword" name="keyword" maxlength="200" th:value="${keyword}"></div><div class="col-md-3 search-actions"><a class="btn btn-outline-secondary" th:href="@{/finished-goods-lots}">초기화</a><button class="btn btn-primary" type="submit">검색</button></div></form><div th:if="${searchError}" class="alert alert-danger mt-3 mb-0" th:text="${searchError}"></div></section>
    <section class="panel list-panel"><div class="list-heading"><h2>완제품 LOT 목록</h2><span class="count-pill" th:text="${#lists.size(lots)}"></span></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>LOT 번호</th><th>작업지시</th><th>제품</th><th>누적 생산 / 양품 / 불량</th><th>상태</th></tr></thead><tbody><tr th:each="lot : ${lots}"><td><a th:href="@{/finished-goods-lots/{id}(id=${lot.finishedLotId})}" th:text="${lot.lotNo}"></a></td><td th:text="${lot.workOrderId}"></td><td th:text="${lot.productCode + ' · ' + lot.productName}"></td><td th:text="${lot.producedQty.stripTrailingZeros().toPlainString() + ' / ' + lot.goodQty.stripTrailingZeros().toPlainString() + ' / ' + lot.defectQty.stripTrailingZeros().toPlainString()}"></td><td th:text="${lot.workOrderStatus}"></td></tr><tr th:if="${#lists.isEmpty(lots)}"><td colspan="5" class="empty-state">조회된 완제품 LOT이 없습니다.</td></tr></tbody></table></div></section>
</main></body></html>
