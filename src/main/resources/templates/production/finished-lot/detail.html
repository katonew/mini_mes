<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('완제품 LOT 상세', ~{::main})}"><head><title>완제품 LOT 상세</title></head><body><main id="main-content"><a class="back-link" th:href="@{/finished-goods-lots}">← 완제품 LOT 목록</a><section class="page-heading"><div><p class="eyebrow">LOT / FINISHED GOODS</p><h1 th:text="${lot.lotNo}"></h1><p class="page-description" th:text="${lot.productCode + ' · ' + lot.productName}"></p></div></section>
    <section class="panel search-panel"><div class="section-heading"><h2>LOT 생산 근거</h2></div><dl class="row mb-0 bom-summary"><dt class="col-sm-4">작업지시</dt><dd class="col-sm-8"><a th:href="@{/work-orders/{id}(id=${lot.workOrderId})}" th:text="${lot.workOrderId}"></a></dd><dt class="col-sm-4">상태</dt><dd class="col-sm-8" th:text="${lot.workOrderStatus}"></dd><dt class="col-sm-4">누적 생산 / 양품 / 불량</dt><dd class="col-sm-8" th:text="${lot.producedQty.stripTrailingZeros().toPlainString() + ' / ' + lot.goodQty.stripTrailingZeros().toPlainString() + ' / ' + lot.defectQty.stripTrailingZeros().toPlainString() + ' EA'}"></dd><dt class="col-sm-4">생성시각 (KST)</dt><dd class="col-sm-8" th:text="${@kstDateTimeFormatter.formatUtc(lot.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></dd></dl><p class="form-text mb-0">누적수량은 연결된 생산실적에서 계산합니다. LOT 수량을 직접 변경하지 않습니다.</p></section>
    <div class="d-flex flex-wrap gap-2 mb-4"><a class="btn btn-outline-primary" th:href="@{/finished-goods-lots/{id}/trace(id=${lot.finishedLotId})}">LOT 역추적</a><a class="btn btn-outline-primary" th:href="@{/finished-goods-lots/{id}/inspections(id=${lot.finishedLotId})}">검사 이력 · 누적 품질 수량</a><a th:if="${lot.workOrderStatus == 'COMPLETED'}" class="btn btn-primary" th:href="@{/quality-inspections/new(finishedLotId=${lot.finishedLotId})}">품질검사 등록</a></div>
    <section class="panel list-panel"><div class="list-heading"><h2>연결된 생산실적</h2><span class="count-pill" th:text="${#lists.size(results)}"></span></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>실적</th><th>생산 / 양품 / 불량</th><th>작업자</th><th>생산시각 (KST)</th></tr></thead><tbody><tr th:each="row : ${results}"><td><a th:href="@{/production-results/{id}(id=${row.productionResultId})}" th:text="${row.productionResultId}"></a></td><td th:text="${row.producedQty.stripTrailingZeros().toPlainString() + ' / ' + row.goodQty.stripTrailingZeros().toPlainString() + ' / ' + row.defectQty.stripTrailingZeros().toPlainString()}"></td><td th:text="${row.workerRef}"></td><td th:text="${@kstDateTimeFormatter.formatUtc(row.producedAt, 'yyyy-MM-dd HH:mm:ss')}"></td></tr></tbody></table></div></section>
</main></body></html>
