<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><title>생산실적 정정 공통 표시</title></head><body>
<section th:fragment="current" class="panel search-panel"><div class="section-heading"><h2>현재 유효 생산실적</h2></div><dl class="row mb-0 bom-summary">
    <dt class="col-sm-4">현재 버전 / 작업지시 상태</dt><dd class="col-sm-8" th:text="${result.revisionNo + ' / ' + order.statusLabel}"></dd>
    <dt class="col-sm-4">생산 / 양품 / 불량</dt><dd class="col-sm-8" th:text="${result.producedQty.stripTrailingZeros().toPlainString() + ' / ' + result.goodQty.stripTrailingZeros().toPlainString() + ' / ' + result.defectQty.stripTrailingZeros().toPlainString() + ' EA'}"></dd>
    <dt class="col-sm-4">작업자</dt><dd class="col-sm-8" th:text="${result.workerRef}"></dd>
    <dt class="col-sm-4">생산시각 (KST)</dt><dd class="col-sm-8" th:text="${@kstDateTimeFormatter.formatUtc(result.producedAt, 'yyyy-MM-dd HH:mm:ss.SSSSSS')}"></dd>
    <dt class="col-sm-4">작업지시 지시수량</dt><dd class="col-sm-8"><a th:href="@{/work-orders/{id}(id=${order.workOrderId})}" th:text="${order.workOrderId}"></a><span th:text="${' / ' + order.orderedQty.stripTrailingZeros().toPlainString() + ' EA'}"></span></dd>
    <dt class="col-sm-4">작업지시 누적 생산 / 양품 / 불량</dt><dd class="col-sm-8" th:text="${totals.producedQty.stripTrailingZeros().toPlainString() + ' / ' + totals.goodQty.stripTrailingZeros().toPlainString() + ' / ' + totals.defectQty.stripTrailingZeros().toPlainString() + ' EA'}"></dd>
</dl><p class="form-text mb-0">누적수량은 현재 생산실적만 합산합니다. 정정 이력·최초 등록 결과는 중복 합산하지 않습니다.</p></section>
<section th:fragment="history" class="panel list-panel"><div class="list-heading"><h2>정정 이력 · 변경 전후 기록</h2><span class="count-pill" th:text="${#lists.size(corrections)}"></span></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th scope="col">이력 / 버전</th><th scope="col">변경 전 생산 / 양품 / 불량 (EA)</th><th scope="col">변경 후 생산 / 양품 / 불량 (EA)</th><th scope="col">생산시각 전 → 후 (KST)</th><th scope="col">작업자 전 → 후</th><th scope="col">정정 사유</th><th scope="col">정정 작성자 / 시각 (KST)</th></tr></thead><tbody>
    <tr th:each="row : ${corrections}"><td th:text="${row.correctionId + ' / ' + row.fromRevision + ' → ' + row.toRevision}"></td>
        <td th:text="${row.beforeProducedQty.stripTrailingZeros().toPlainString() + ' / ' + row.beforeGoodQty.stripTrailingZeros().toPlainString() + ' / ' + row.beforeDefectQty.stripTrailingZeros().toPlainString()}"></td>
        <td th:text="${row.afterProducedQty.stripTrailingZeros().toPlainString() + ' / ' + row.afterGoodQty.stripTrailingZeros().toPlainString() + ' / ' + row.afterDefectQty.stripTrailingZeros().toPlainString()}"></td>
        <td><div th:text="${@kstDateTimeFormatter.formatUtc(row.beforeProducedAt, 'yyyy-MM-dd HH:mm:ss.SSSSSS')}"></div><div th:text="${'→ ' + @kstDateTimeFormatter.formatUtc(row.afterProducedAt, 'yyyy-MM-dd HH:mm:ss.SSSSSS')}"></div></td>
        <td th:text="${row.beforeWorkerRef + ' → ' + row.afterWorkerRef}"></td><td class="text-break" th:text="${row.reason}"></td><td><div th:text="${row.createdBy}"></div><div class="subtle" th:text="${@kstDateTimeFormatter.formatUtc(row.createdAt, 'yyyy-MM-dd HH:mm:ss.SSSSSS')}"></div></td>
    </tr><tr th:if="${#lists.isEmpty(corrections)}"><td colspan="7" class="empty-state">정정 기록 없음</td></tr>
</tbody></table></div></section>
</body></html>
