<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('생산실적 상세', ~{::main})}"><head><title>생산실적 상세</title></head><body><main id="main-content">
    <a class="back-link" th:href="@{/production-results(workOrderId=${result.workOrderId})}">← 작업지시 실적 목록</a><section class="page-heading"><div><p class="eyebrow">PRODUCTION / RESULTS</p><h1 th:text="${'생산실적 ' + result.productionResultId}"></h1><p class="page-description" th:text="${result.productCode + ' · ' + result.productName}"></p></div></section>
    <div class="d-flex flex-wrap gap-2 mb-4"><a th:if="${correctionAllowed}" class="btn btn-primary" th:href="@{/production-results/{id}/corrections/new(id=${result.productionResultId})}">생산수량 정정</a><a class="btn btn-outline-primary" th:href="@{/production-results/{id}/corrections(id=${result.productionResultId})}">정정 이력</a></div>
    <section th:replace="~{production/result/correction-fragments :: current}"></section>
    <section class="panel search-panel"><div class="section-heading"><h2>최초 등록 성공 결과 · 보존된 Receipt</h2></div><dl class="row mb-0 bom-summary"><dt class="col-sm-4">작업지시</dt><dd class="col-sm-8"><a th:href="@{/work-orders/{id}(id=${result.workOrderId})}" th:text="${result.workOrderId}"></a></dd><dt class="col-sm-4">완제품 LOT</dt><dd class="col-sm-8"><a th:href="@{/finished-goods-lots/{id}(id=${result.finishedLotId})}" th:text="${result.lotNo}"></a></dd><dt class="col-sm-4">생산 / 양품 / 불량</dt><dd class="col-sm-8" th:text="${result.outcome.producedQty + ' / ' + result.outcome.goodQty + ' / ' + result.outcome.defectQty + ' EA'}"></dd><dt class="col-sm-4">작업자</dt><dd class="col-sm-8" th:text="${result.outcome.workerRef}"></dd><dt class="col-sm-4">생산시각 (KST)</dt><dd class="col-sm-8" th:text="${@kstDateTimeFormatter.formatUtc(result.outcome.producedAt, 'yyyy-MM-dd HH:mm:ss.SSSSSS')}"></dd><dt class="col-sm-4">시스템 작성자</dt><dd class="col-sm-8" th:text="${result.createdBy}"></dd></dl><p class="form-text mb-0">최초 등록 요청의 재전송은 이 결과를 반환합니다. 현재 실적 수량은 위의 현재 유효 생산실적과 구분합니다.</p></section>
</main></body></html>
