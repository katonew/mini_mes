<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('생산실적 목록', ~{::main})}"><head><title>생산실적 목록</title></head><body><main id="main-content">
    <section class="page-heading"><div><p class="eyebrow">PRODUCTION / RESULTS</p><h1>생산실적</h1><p class="page-description">작업지시와 완제품 LOT에 연결된 실제 생산 기록입니다.</p></div><a class="btn btn-primary" th:href="@{/production-results/new}">＋ 생산실적 등록</a></section>
    <section class="panel search-panel"><div class="section-heading"><h2>생산실적 검색</h2></div><form method="get" th:action="@{/production-results}" class="row g-3 align-items-end"><div class="col-md-3"><label class="form-label" for="workOrderId">작업지시 ID</label><input class="form-control" id="workOrderId" name="workOrderId" inputmode="numeric" th:value="${workOrderId}"></div><div class="col-md-3"><label class="form-label" for="lotNo">완제품 LOT 번호</label><input class="form-control" id="lotNo" name="lotNo" maxlength="64" th:value="${lotNo}"></div><div class="col-md-3"><label class="form-label" for="keyword">제품 코드·명칭</label><input class="form-control" id="keyword" name="keyword" maxlength="200" th:value="${keyword}"></div><div class="col-md-3 search-actions"><a class="btn btn-outline-secondary" th:href="@{/production-results}">초기화</a><button class="btn btn-primary" type="submit">검색</button></div></form><div th:if="${searchError}" class="alert alert-danger mt-3 mb-0" th:text="${searchError}"></div></section>
    <section class="panel list-panel"><div class="list-heading"><h2>실적 목록</h2><span class="count-pill" th:text="${#lists.size(results)}"></span></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>실적 / 작업지시</th><th>완제품 LOT</th><th>제품</th><th>생산 / 양품 / 불량</th><th>작업자</th><th>생산시각 (KST)</th></tr></thead><tbody><tr th:each="row : ${results}"><td><a th:href="@{/production-results/{id}(id=${row.productionResultId})}" th:text="${row.productionResultId}"></a><small class="d-block subtle" th:text="${'작업지시 ' + row.workOrderId}"></small></td><td><a th:href="@{/finished-goods-lots/{id}(id=${row.finishedLotId})}" th:text="${row.lotNo}"></a></td><td th:text="${row.productCode + ' · ' + row.productName}"></td><td th:text="${row.producedQty.stripTrailingZeros().toPlainString() + ' / ' + row.goodQty.stripTrailingZeros().toPlainString() + ' / ' + row.defectQty.stripTrailingZeros().toPlainString()}"></td><td th:text="${row.workerRef}"></td><td th:text="${@kstDateTimeFormatter.formatUtc(row.producedAt, 'yyyy-MM-dd HH:mm')}"></td></tr><tr th:if="${#lists.isEmpty(results)}"><td colspan="6" class="empty-state">조회된 생산실적이 없습니다.</td></tr></tbody></table></div></section>
</main></body></html>
