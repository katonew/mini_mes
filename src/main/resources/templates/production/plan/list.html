<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('생산계획 관리', ~{::main})}">
<head><title>생산계획 관리</title></head><body><main id="main-content">
    <section class="page-heading"><div><p class="eyebrow">PRODUCTION / PLANS</p><h1>생산계획 관리</h1><p class="page-description">완제품의 계획 수량과 계획일을 등록하고 조회합니다.</p></div><a class="btn btn-primary" th:href="@{/production-plans/new}">＋ 생산계획 등록</a></section>
    <section class="panel search-panel" aria-labelledby="search-title"><div class="section-heading"><h2 id="search-title">생산계획 검색</h2><span class="subtle">계획 ID와 완제품으로 조회</span></div>
        <form method="get" th:action="@{/production-plans}" class="row g-3 align-items-end">
            <div class="col-md-3"><label for="searchPlanId" class="form-label">계획 ID</label><input class="form-control" id="searchPlanId" name="planId" inputmode="numeric" maxlength="19" pattern="[0-9]+" th:value="${planId}" placeholder="계획 ID 입력"></div>
            <div class="col-md-3"><label for="searchCode" class="form-label">완제품 코드</label><input class="form-control" id="searchCode" name="code" type="search" maxlength="50" th:value="${code}" placeholder="완제품 코드 입력"></div>
            <div class="col-md-3"><label for="searchName" class="form-label">완제품 명칭</label><input class="form-control" id="searchName" name="name" type="search" maxlength="200" th:value="${name}" placeholder="완제품 명칭 입력"></div>
            <div class="col-md-3 search-actions"><a class="btn btn-outline-secondary" th:href="@{/production-plans}">초기화</a><button class="btn btn-primary" type="submit">검색</button></div>
        </form><div th:if="${searchError}" class="alert alert-danger mt-3 mb-0" role="alert" th:text="${searchError}"></div>
    </section>
    <section class="panel list-panel" aria-labelledby="list-title"><div class="list-heading"><div class="d-flex align-items-center gap-2"><h2 id="list-title">생산계획 목록</h2><span th:if="${searchError == null}" class="count-pill" th:text="${#lists.size(plans)}"></span></div><span class="subtle">최신 등록순</span></div>
        <div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th scope="col">계획 ID</th><th scope="col">완제품</th><th scope="col" class="text-end">계획 수량</th><th scope="col">계획일</th><th scope="col">등록일 (KST)</th><th scope="col" class="text-end">관리</th></tr></thead>
            <tbody><tr th:each="plan : ${plans}"><td><a class="item-code" th:href="@{/production-plans/{id}(id=${plan.productionPlanId})}" th:text="${plan.productionPlanId}"></a></td>
                <td class="item-name"><span th:text="${plan.productName}"></span><small class="d-block subtle" th:text="${plan.productCode}"></small></td><td class="text-end" th:text="${plan.plannedQty.stripTrailingZeros().toPlainString() + ' ' + plan.unitCode}"></td>
                <td th:text="${#temporals.format(plan.plannedDate, 'yyyy-MM-dd')}"></td><td th:text="${@kstDateTimeFormatter.formatUtc(plan.createdAt, 'yyyy-MM-dd HH:mm')}"></td><td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/production-plans/{id}(id=${plan.productionPlanId})}">상세</a></td></tr>
                <tr th:if="${#lists.isEmpty(plans) and searchError == null}"><td colspan="6" class="empty-state"><span class="empty-mark" aria-hidden="true">—</span><strong>조회된 생산계획이 없습니다</strong><p>검색 조건을 변경하거나 새로운 생산계획을 등록해 주세요.</p><a class="btn btn-outline-primary btn-sm" th:href="@{/production-plans/new}">생산계획 등록</a></td></tr>
                <tr th:if="${searchError}"><td colspan="6" class="empty-state">검색 조건을 확인해 주세요.</td></tr>
            </tbody></table></div><div class="table-note"><span class="note-dot"></span>계획코드·계획 상태는 현재 스키마에 없습니다. 등록만으로 작업지시나 LOT가 생성되지 않습니다.</div>
    </section>
</main></body></html>
